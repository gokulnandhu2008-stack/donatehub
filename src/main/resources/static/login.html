<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DonateHub Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2c3e50;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .secondary-button {
            background: white;
            color: #2c3e50;
            border: 1px solid #2c3e50;
            margin-top: 10px;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .switch-text {
            text-align: center;
            margin-top: 18px;
            color: #666;
        }

        .switch-text a {
            color: #2c3e50;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>DonateHub</h1>

    <p class="subtitle">
        Donation Management System
    </p>


    <!-- LOGIN FORM -->
    <div id="loginSection" class="form-section active">

        <h2>Login</h2>

        <form id="loginForm">

            <label for="loginUsername">
                Username
            </label>

            <input
                type="text"
                id="loginUsername"
                placeholder="Enter username"
                required
            >

            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="loginMessage" class="message"></div>

        <p class="switch-text">
            New user?
            <a onclick="showRegister()">
                Create an account
            </a>
        </p>

    </div>


    <!-- REGISTER FORM -->
    <div id="registerSection" class="form-section">

        <h2>Create Account</h2>

        <form id="registerForm">

            <label for="registerUsername">
                Username
            </label>

            <input
                type="text"
                id="registerUsername"
                placeholder="Choose a username"
                required
            >

            <label for="registerPassword">
                Password
            </label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Choose a password"
                required
            >

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <div id="registerMessage" class="message"></div>

        <p class="switch-text">
            Already have an account?
            <a onclick="showLogin()">
                Login
            </a>
        </p>

    </div>

</div>


<script src="login.js"></script>

</body>
</html>
